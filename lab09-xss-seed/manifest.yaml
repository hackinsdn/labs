apiVersion: v1
kind: ConfigMap
metadata:
  name: labdata-webtop-${pod_hash}
data:
  update-hosts-from-env.sh: |
    #!/usr/bin/with-contenv bash
    echo "Waiting for service envvar..."
    for i in {1..600}
    do
       SRV_IP=$(getent hosts elgg-$POD_HASH | cut -f1 -d' ')
       if [ -n "$SRV_IP" ]; then
         echo $SRV_IP www.seed-server.com www.example32a.com www.example32b.com www.example32c.com www.example60.com www.example70.com >> /etc/hosts
         break
       fi
       sleep 5
    done
    echo "Script execution completed successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop-${pod_hash}
  labels:
    app: webtop-${pod_hash}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webtop-${pod_hash}
  template:
    metadata:
      name: webtop-${pod_hash}
      labels:
        app: webtop-${pod_hash}
      annotations:
        container.apparmor.security.beta.kubernetes.io/webtop: unconfined
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${choose_one_node}
      containers:
      - name: webtop
        image: hackinsdn/webtop:latest
        env:
        - name: LC_ALL
          value: "pt_BR.UTF-8"
        - name: POD_HASH
          value: ${pod_hash}
        ports:
        - containerPort: 3000
        - containerPort: 3001
        volumeMounts:
        - name: labdata-webtop
          mountPath: /custom-cont-init.d/update-hosts-from-env.sh
          subPath: update-hosts-from-env.sh
      volumes:
        - name: labdata-webtop
          configMap:
            name: labdata-webtop-${pod_hash}
            defaultMode: 0755
---
# created with:
#   tar -czf labdata-mysql.tgz -C ./labdata-mysql .
#   kubectl create configmap my-config --from-file=labdata-mysql.tgz  --dry-run=client -o yaml >> manifest.yaml
#   rm labdata-mysql.tgz
apiVersion: v1
kind: ConfigMap
metadata:
  name: labdata-mysql-${pod_hash}
binaryData:
  labdata-mysql.tgz: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elgg-${pod_hash}
spec:
  selector:
    matchLabels:
      app: elgg-${pod_hash}
  template:
    metadata:
      labels:
        app: elgg-${pod_hash}
    spec:
      containers:
      - name: elgg
        image: hackinsdn/seed-elgg:latest
        ports:
        - containerPort: 80
      - name: mysql
        image: mysql:8.4
        command: ["bash", "-c"]
        args:
        - tar -xzf /mnt/labdata-mysql.tgz -C /;
          exec /usr/local/bin/docker-entrypoint.sh mysqld
        ports:
          - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: dees
          - name: MYSQL_USER
            value: seed
          - name: MYSQL_PASSWORD
            value: dees
          - name: MYSQL_DATABASE
            value: elgg_seed
        volumeMounts:
          - name: labdata-mysql
            mountPath: /mnt
      volumes:
        - name: labdata-mysql
          configMap:
            name: labdata-mysql-${pod_hash}
---
apiVersion: v1
kind: Service
metadata:
  name: elgg-${pod_hash}
  labels:
    app: elgg-${pod_hash}
spec:
  clusterIP: None
  ports:
  - port: 80
    targetPort: 80
    name: http-elgg
  selector:
    app: elgg-${pod_hash}
---
apiVersion: v1
kind: Service
metadata:
  name: webtop-${pod_hash}
  labels:
    app: webtop-${pod_hash}
spec:
  type: NodePort
  ports:
  - port: 3001
    targetPort: 3001
    name: https-webtop
  selector:
    app: webtop-${pod_hash}
