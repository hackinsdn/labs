# tar -C labdata/ -czf - .  | base64
apiVersion: v1
kind: ConfigMap
metadata:
  name: labdata-${pod_hash}
binaryData:
  labdata.tgz: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: py3-host-${pod_hash}
  labels:
    app: py3-host-${pod_hash}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py3-host-${pod_hash}
  template:
    metadata:
      name: py3-host-${pod_hash}
      labels:
        app: py3-host-${pod_hash}
    spec:
      volumes:
        - name: configmap-labdata
          configMap:
            name: labdata-${pod_hash}
        - name: extracted-labdata
          emptyDir: {}
      initContainers:
        - name: untar-config
          image: alpine:3.24
          command:
            - "sh"
            - "-c"
            - "tar -xzf /config-source/labdata.tgz -C /app-dest/"
          volumeMounts:
            - name: config-labdata
              mountPath: /config-source
            - name: extracted-labdata
              mountPath: /app-dest
      containers:
        - name: py3-host
          image: hackinsdn/python:3.12
          workingDir: /labdata
          volumeMounts:
            - name: extracted-labdata
              mountPath: /labdata
