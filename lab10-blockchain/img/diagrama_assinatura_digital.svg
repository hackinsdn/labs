<svg viewBox="0 0 1220 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama do fluxo de assinatura e verificação digital: a chave privada da Alice, que só ela possui, assina uma mensagem para gerar uma assinatura; essa assinatura, junto com a chave pública da Alice, que qualquer pessoa pode ter, é usada para verificar a transação. Quando a mensagem verificada é a original, a verificação dá válida; quando a mensagem foi alterada depois de assinada, a mesma assinatura e a mesma chave pública resultam em uma verificação inválida.">
  <title>Fluxo de assinatura e verificação digital (ECDSA)</title>

  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrGreenOut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrRedOut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="500" fill="#ffffff"/>
  <rect x="1" y="1" width="1218" height="498" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <text x="610" y="30" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Como Funciona a Assinatura Digital (ECDSA)</text>
  <text x="610" y="50" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="12.5" fill="#475569">A mesma assinatura e a mesma chave pública dão resultados diferentes dependendo da mensagem</text>

  <!-- zonas -->
  <rect x="20" y="66" width="410" height="410" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="10"/>
  <rect x="450" y="66" width="750" height="410" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="10"/>
  <text x="225" y="86" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">SÓ A ALICE TEM (chave privada)</text>
  <text x="825" y="86" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">QUALQUER PESSOA PODE TER (chave pública)</text>

  <!-- ===== ZONA ESQUERDA: assinar ===== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="50" y="105" width="350" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
    <text x="225" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Chave Privada da Alice (secreta)</text>

    <rect x="50" y="178" width="350" height="55" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
    <text x="225" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">MENSAGEM</text>
    <text x="225" y="219" text-anchor="middle" font-size="12.5" fill="#334155">"Alice → Bob: 10"</text>

    <rect x="155" y="263" width="140" height="55" fill="#1e293b" rx="8"/>
    <text x="225" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">sign()</text>

    <rect x="140" y="355" width="170" height="65" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="225" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">ASSINATURA</text>
    <text x="225" y="394" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" font-weight="700" fill="#1e3a8a">af33cc08…9af1</text>

    <path d="M 200,160 L 210,263" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrGray)"/>
    <path d="M 250,233 L 240,263" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrGray)"/>
    <path d="M 225,318 L 225,355" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>

  <!-- ===== ZONA DIREITA: verificar ===== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="480" y="105" width="340" height="55" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6"/>
    <text x="650" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">Chave Pública da Alice (endereço)</text>

    <!-- ramo válido -->
    <rect x="480" y="188" width="330" height="55" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
    <text x="645" y="207" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">MENSAGEM RECEBIDA (sem alteração)</text>
    <text x="645" y="226" text-anchor="middle" font-size="12.5" fill="#334155">"Alice → Bob: 10"</text>

    <rect x="870" y="178" width="110" height="75" fill="#1e293b" rx="8"/>
    <text x="925" y="220" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">verify()</text>

    <rect x="1020" y="188" width="170" height="55" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="6"/>
    <text x="1105" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">✓ Válida</text>

    <!-- ramo invalido -->
    <rect x="480" y="340" width="330" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>
    <text x="645" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">MENSAGEM ALTERADA (depois de assinada)</text>
    <text x="645" y="378" text-anchor="middle" font-size="12.5" fill="#991b1b">"Alice → Bob: 10000"</text>

    <rect x="870" y="330" width="110" height="75" fill="#1e293b" rx="8"/>
    <text x="925" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">verify()</text>

    <rect x="1020" y="340" width="170" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6"/>
    <text x="1105" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">✕ Inválida</text>

    <!-- setas chave publica -> verify (ambos ramos) -->
    <path d="M 650,160 C 650,175 900,165 910,178" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
    <path d="M 650,160 C 650,300 900,300 910,330" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>

    <!-- setas mensagem -> verify -->
    <path d="M 810,215 L 870,215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrGray)"/>
    <path d="M 810,367 L 870,367" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrGray)"/>

    <!-- setas verify -> resultado -->
    <path d="M 980,215 L 1020,215" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreenOut)"/>
    <path d="M 980,367 L 1020,367" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRedOut)"/>
  </g>

  <!-- seta da assinatura cruzando a fronteira para os dois verify() -->
  <path d="M 310,388 C 600,388 700,215 870,213" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="1,0" marker-end="url(#arrBlue)"/>
  <path d="M 310,388 C 500,388 780,365 870,365" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <text x="610" y="460" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" fill="#475569">A verificação usa só dados públicos (assinatura + chave pública) — mas o resultado muda se a mensagem mudou depois de assinada.</text>
</svg>
