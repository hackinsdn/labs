<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dois tipos independentes de falha de integridade: Tipo 1, quando o conteúdo de um bloco não bate mais com seu próprio hash armazenado; Tipo 2, quando o hash anterior de um bloco não bate com o hash real do bloco que vem antes dele, mesmo que cada bloco continue consistente com seu próprio conteúdo.">
  <title>Dois tipos de falha de integridade detectados por is_chain_valid()</title>

  <rect x="0" y="0" width="1160" height="470" fill="#ffffff"/>
  <rect x="1" y="1" width="1158" height="468" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <text x="580" y="34" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Dois Tipos de Falha de Integridade</text>
  <text x="580" y="56" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13.5" fill="#475569">is_chain_valid() verifica os dois, de forma independente, em toda a cadeia</text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===================== PAINEL ESQUERDO: TIPO 1 ===================== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="30" y="80" width="540" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
    <rect x="30" y="80" width="540" height="34" fill="#1e293b" rx="10"/>
    <rect x="30" y="102" width="540" height="12" fill="#1e293b"/>
    <text x="50" y="102" font-size="13.5" font-weight="700" fill="#ffffff">TIPO 1 — Conteúdo inconsistente com o próprio hash</text>

    <!-- card do bloco -->
    <rect x="70" y="140" width="220" height="140" fill="#ffffff" stroke="#334155" stroke-width="2" rx="8"/>
    <rect x="70" y="140" width="220" height="36" fill="#1d4ed8" rx="8"/>
    <rect x="70" y="164" width="220" height="12" fill="#1d4ed8"/>
    <text x="82" y="163" font-size="13.5" font-weight="700" fill="#ffffff">BLOCO 2</text>

    <rect x="76" y="180" width="208" height="46" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="5"/>
    <text x="88" y="194" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#991b1b">DADOS (alterados agora)</text>
    <text x="88" y="213" font-size="12" fill="#991b1b">"Transferir 1.000.000…"</text>

    <rect x="76" y="230" width="208" height="46" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="5"/>
    <text x="88" y="244" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#065f46">HASH ARMAZENADO (antigo)</text>
    <text x="88" y="263" font-size="12" font-family="Menlo, Consolas, monospace" font-weight="700" fill="#065f46">7f3b41af…9e3c</text>

    <circle cx="180" cy="300" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <text x="180" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">≠</text>

    <text x="180" y="332" text-anchor="middle" font-size="11.5" fill="#334155">Hash recalculado agora a partir do conteúdo atual:</text>
    <text x="180" y="352" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" font-weight="700" fill="#dc2626">c2f2500a…88fd</text>

    <text x="180" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">→ detectado: "hash armazenado não bate"</text>
  </g>

  <!-- ===================== PAINEL DIREITO: TIPO 2 ===================== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="590" y="80" width="540" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
    <rect x="590" y="80" width="540" height="34" fill="#1e293b" rx="10"/>
    <rect x="590" y="102" width="540" height="12" fill="#1e293b"/>
    <text x="610" y="102" font-size="13.5" font-weight="700" fill="#ffffff">TIPO 2 — Elo quebrado entre dois blocos</text>

    <!-- card A -->
    <rect x="630" y="140" width="180" height="140" fill="#ffffff" stroke="#334155" stroke-width="2" rx="8"/>
    <rect x="630" y="140" width="180" height="36" fill="#1d4ed8" rx="8"/>
    <rect x="630" y="164" width="180" height="12" fill="#1d4ed8"/>
    <text x="642" y="163" font-size="13" font-weight="700" fill="#ffffff">BLOCO A</text>
    <circle cx="796" cy="150" r="10" fill="#059669"/>
    <text x="796" y="154" text-anchor="middle" font-size="11" fill="#ffffff">✓</text>

    <rect x="636" y="180" width="168" height="46" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="5"/>
    <text x="646" y="194" font-size="9" font-weight="700" letter-spacing="0.3" fill="#475569">DADOS (não mudou)</text>
    <text x="646" y="213" font-size="11.5" fill="#334155">Bob → Carol: 2</text>

    <rect x="636" y="230" width="168" height="46" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="5"/>
    <text x="646" y="244" font-size="9" font-weight="700" letter-spacing="0.3" fill="#065f46">HASH</text>
    <text x="646" y="263" font-size="11.5" font-family="Menlo, Consolas, monospace" font-weight="700" fill="#065f46">a1c9e27f…d94b</text>

    <!-- card B -->
    <rect x="880" y="140" width="180" height="140" fill="#ffffff" stroke="#334155" stroke-width="2" rx="8"/>
    <rect x="880" y="140" width="180" height="36" fill="#1d4ed8" rx="8"/>
    <rect x="880" y="164" width="180" height="12" fill="#1d4ed8"/>
    <text x="892" y="163" font-size="13" font-weight="700" fill="#ffffff">BLOCO B</text>
    <circle cx="1046" cy="150" r="10" fill="#059669"/>
    <text x="1046" y="154" text-anchor="middle" font-size="11" fill="#ffffff">✓</text>

    <rect x="886" y="180" width="168" height="46" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="5"/>
    <text x="896" y="194" font-size="9" font-weight="700" letter-spacing="0.3" fill="#991b1b">HASH ANTERIOR (errado)</text>
    <text x="896" y="213" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#991b1b">c02ee6a1…5f8d</text>

    <rect x="886" y="230" width="168" height="46" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="5"/>
    <text x="896" y="244" font-size="9" font-weight="700" letter-spacing="0.3" fill="#475569">DADOS (não mudou)</text>
    <text x="896" y="263" font-size="11.5" fill="#334155">Carol → Alice: 1</text>

    <!-- seta quebrada entre A e B -->
    <path d="M 810,255 C 845,255 845,205 880,205" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
    <circle cx="845" cy="230" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <text x="845" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">✕</text>

    <text x="860" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">→ detectado: "previous_hash não corresponde ao hash real"</text>
    <text x="860" y="330" text-anchor="middle" font-size="11.5" fill="#334155">Cada bloco continua ✓ consistente com seu próprio conteúdo —</text>
    <text x="860" y="348" text-anchor="middle" font-size="11.5" fill="#334155">o problema é só a referência entre os dois.</text>
  </g>

  <text x="580" y="450" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" fill="#475569">São duas checagens independentes: uma garante que cada bloco não foi alterado; a outra, que a ligação entre blocos não foi quebrada.</text>
</svg>
