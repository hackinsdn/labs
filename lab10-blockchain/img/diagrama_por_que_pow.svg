<svg viewBox="0 0 1240 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparação entre uma rede sem custo para propor blocos, onde três nós publicam versões conflitantes do bloco 5 e a cadeia se fragmenta sem consenso, e uma rede com Proof of Work, onde os três nós competem para resolver um quebra-cabeça computacional, só o vencedor propõe o bloco 5, e os demais verificam com um único cálculo de hash e aceitam, convergindo para uma única cadeia.">
  <title>Por que o Proof of Work existe: sem custo a rede fragmenta, com PoW a rede converge</title>

  <defs>
    <marker id="pow_arrGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="pow_arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="pow_arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="pow_arrGrayThin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="550" fill="#ffffff"/>
  <rect x="1" y="1" width="1238" height="548" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <text x="620" y="30" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Por que o Proof of Work Existe</text>
  <text x="620" y="50" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="12.5" fill="#475569">Sem uma autoridade central, o que impede cada nó de simplesmente publicar sua própria versão do próximo bloco?</text>

  <!-- zonas -->
  <rect x="20" y="68" width="590" height="416" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="10"/>
  <rect x="630" y="68" width="590" height="416" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="10"/>
  <text x="315" y="90" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">SEM CUSTO PARA PROPOR UM BLOCO</text>
  <text x="925" y="90" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">COM PROOF OF WORK</text>

  <!-- ===== ZONA ESQUERDA ===== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="245" y="108" width="140" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
    <text x="315" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">BLOCO 4 (confirmado)</text>

    <path d="M 290,150 L 150,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 315,150 L 315,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 340,150 L 480,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>

    <circle cx="140" cy="212" r="22" fill="#1e293b"/>
    <text x="140" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
    <text x="140" y="248" text-anchor="middle" font-size="10.5" fill="#334155">Nó A</text>

    <circle cx="315" cy="212" r="22" fill="#1e293b"/>
    <text x="315" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
    <text x="315" y="248" text-anchor="middle" font-size="10.5" fill="#334155">Nó B</text>

    <circle cx="490" cy="212" r="22" fill="#1e293b"/>
    <text x="490" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
    <text x="490" y="248" text-anchor="middle" font-size="10.5" fill="#334155">Nó C</text>

    <path d="M 140,234 L 140,298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 315,234 L 315,298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 490,234 L 490,298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>

    <rect x="80" y="300" width="120" height="54" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
    <text x="140" y="322" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">BLOCO 5</text>
    <text x="140" y="339" text-anchor="middle" font-size="10" fill="#991b1b">(versão A)</text>

    <rect x="255" y="300" width="120" height="54" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="6"/>
    <text x="315" y="322" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">BLOCO 5</text>
    <text x="315" y="339" text-anchor="middle" font-size="10" fill="#9a3412">(versão B)</text>

    <rect x="430" y="300" width="120" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
    <text x="490" y="322" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">BLOCO 5</text>
    <text x="490" y="339" text-anchor="middle" font-size="10" fill="#78350f">(versão C)</text>

    <text x="315" y="392" text-anchor="middle" font-size="12" fill="#7f1d1d">Sem custo para propor, os três publicam ao mesmo tempo — nada</text>
    <text x="315" y="410" text-anchor="middle" font-size="12" fill="#7f1d1d">faz alguém ceder. A rede fragmenta em cadeias conflitantes.</text>

    <rect x="230" y="432" width="170" height="32" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="16"/>
    <text x="315" y="453" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">✕ SEM CONSENSO</text>
  </g>

  <!-- ===== ZONA DIREITA ===== -->
  <g font-family="system-ui, Arial, sans-serif">
    <rect x="855" y="108" width="140" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
    <text x="925" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">BLOCO 4 (confirmado)</text>

    <path d="M 900,150 L 760,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 925,150 L 925,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>
    <path d="M 950,150 L 1090,192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#pow_arrGray)"/>

    <circle cx="750" cy="212" r="22" fill="#1e293b"/>
    <text x="750" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
    <text x="750" y="246" text-anchor="middle" font-size="10.5" fill="#334155">Nó A</text>

    <circle cx="925" cy="212" r="22" fill="#1e293b"/>
    <text x="925" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
    <text x="925" y="246" text-anchor="middle" font-size="10.5" fill="#334155">Nó B</text>

    <circle cx="1100" cy="212" r="22" fill="#1e293b"/>
    <text x="1100" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
    <text x="1100" y="246" text-anchor="middle" font-size="10.5" fill="#334155">Nó C</text>

    <rect x="695" y="256" width="110" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
    <text x="750" y="277" text-anchor="middle" font-size="9.5" fill="#64748b">tentativa #1.204</text>

    <rect x="870" y="256" width="110" height="34" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="6"/>
    <text x="925" y="277" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">nonce encontrado!</text>

    <rect x="1045" y="256" width="110" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
    <text x="1100" y="277" text-anchor="middle" font-size="9.5" fill="#64748b">tentativa #2.210</text>

    <path d="M 750,290 Q 800,326 838,343" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#pow_arrGrayThin)"/>
    <path d="M 1100,290 Q 1050,326 1012,343" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#pow_arrGrayThin)"/>
    <text x="763" y="330" text-anchor="middle" font-size="9" fill="#64748b">verifica</text>
    <text x="1087" y="330" text-anchor="middle" font-size="9" fill="#64748b">verifica</text>

    <path d="M 925,290 L 925,318" fill="none" stroke="#059669" stroke-width="2.25" marker-end="url(#pow_arrGreen)"/>

    <rect x="845" y="320" width="160" height="54" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="6"/>
    <text x="925" y="342" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">BLOCO 5</text>
    <text x="925" y="359" text-anchor="middle" font-size="10" fill="#065f46">(proposto por Nó B)</text>

    <text x="925" y="398" text-anchor="middle" font-size="12" fill="#14532d">Só quem resolve o quebra-cabeça primeiro propõe o bloco.</text>
    <text x="925" y="416" text-anchor="middle" font-size="12" fill="#14532d">Os outros verificam com 1 cálculo de hash e aceitam.</text>

    <rect x="840" y="432" width="170" height="32" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="16"/>
    <text x="925" y="453" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">✓ CONSENSO</text>
  </g>

  <text x="620" y="518" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="13" fill="#475569">O custo computacional é o que impede qualquer nó de propor blocos de graça — é isso que substitui a autoridade central.</text>
</svg>
